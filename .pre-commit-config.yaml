repos:
  # Go formatting + vet via local toolchain
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet-mod
        args: [-tags=webkit2_41]

  # golangci-lint (uses .golangci.yml)
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --build-tags webkit2_41
        language: system
        types: [go]
        pass_filenames: false

  # Version sync — keep wails.json + frontend/package.json in step with .app-version
  - repo: local
    hooks:
      - id: version-sync
        name: version sync
        entry: task version:sync
        language: system
        pass_filenames: false
        files: ^\.app-version$

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
